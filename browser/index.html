<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Shift Test UI</title>
    <!-- Load React, ReactDOM, and Babel from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1115; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(scrollToBottom, [messages]);

            const sendMessage = async () => {
                if (!input.trim()) return;
                
                const userMsg = input.trim();
                setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setInput("");
                setLoading(true);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMsg })
                    });
                    const data = await response.json();
                    
                    if (data.type === 'om_results') {
                        let text = "Recent Chats:\n";
                        data.data.forEach((chat, i) => {
                            text += `[${i + 1}] ${chat.title}\n`;
                        });
                        text += "\nType 'search <name>' or a number to select.";
                        setMessages(prev => [...prev, { sender: 'bot', text: text }]);
                    } else if (data.type === 'system') {
                        setMessages(prev => [...prev, { sender: 'system', text: data.message }]);
                    } else if (data.type === 'error') {
                        setMessages(prev => [...prev, { sender: 'error', text: data.message }]);
                    } else {
                        setMessages(prev => [...prev, { sender: 'bot', text: data.message }]);
                    }
                } catch (err) {
                    setMessages(prev => [...prev, { sender: 'error', text: "Connection failed to backend server." }]);
                }
                
                setLoading(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            return (
                <div className="max-w-4xl mx-auto h-screen flex flex-col p-4">
                    <div className="flex-1 bg-[#16181d] rounded-t-xl border border-gray-800 p-4 overflow-y-auto flex flex-col gap-4">
                        {messages.length === 0 && (
                            <div className="text-gray-500 text-center mt-20">
                                <p className="text-2xl font-semibold mb-2 text-gray-300">Axiom Shift Test UI</p>
                                <p>Type <span className="bg-gray-800 text-gray-200 px-1 rounded">\om/</span> to list your chats, or send a prompt to ChatGPT.</p>
                            </div>
                        )}
                        {messages.map((m, i) => (
                            <div key={i} className={`p-4 rounded-xl max-w-[85%] whitespace-pre-wrap leading-relaxed shadow-sm ${
                                m.sender === 'user' ? 'bg-blue-600 self-end text-white rounded-br-none' :
                                m.sender === 'error' ? 'bg-red-900/40 text-red-200 border border-red-700/50 self-start' :
                                m.sender === 'system' ? 'bg-gray-800/80 text-gray-300 self-center text-sm italic' :
                                'bg-[#20232a] self-start border border-gray-700/50 rounded-bl-none text-gray-200'
                            }`}>
                                {m.text}
                            </div>
                        ))}
                        {loading && (
                            <div className="bg-[#20232a] self-start p-4 rounded-xl rounded-bl-none border border-gray-700/50 text-gray-400 flex items-center gap-3">
                                <div className="flex gap-1">
                                    <div className="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
                                    <div className="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style={{animationDelay: "0.2s"}}></div>
                                    <div className="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style={{animationDelay: "0.4s"}}></div>
                                </div>
                                <span>Axiom Shift is thinking...</span>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>
                    
                    <div className="bg-[#1a1d24] border border-t-0 border-gray-800 rounded-b-xl p-4 flex gap-3 shadow-lg">
                        <input 
                            type="text" 
                            className="flex-1 bg-[#0f1115] border border-gray-700 rounded-lg px-5 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-lg shadow-inner"
                            placeholder="Send a message... (Type \om/ for menu)"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyDown={handleKeyDown}
                            disabled={loading}
                        />
                        <button 
                            className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                            onClick={sendMessage}
                            disabled={loading}
                        >
                            Send
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
